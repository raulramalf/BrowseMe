# Blueprint de Render para publicar el backend gratis (plan free).
# Render → New → Blueprint → elige este repositorio. Al crearlo pedirá
# BROWSEME_ALLOWED_ORIGINS: la URL pública del frontend (p. ej. https://browseme.vercel.app).
# Perfil «cloud»: sin PostgreSQL ni Ollama (repositorio en memoria, IA desactivada).
services:
  - type: web
    name: browseme-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: BROWSEME_ALLOWED_ORIGINS
        sync: false
      # 512 MB de RAM en el plan gratuito: montón acotado y GC ligero.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError
