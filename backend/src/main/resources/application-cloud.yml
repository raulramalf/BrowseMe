# Perfil para alojamiento gratuito (por ejemplo, Render): sin PostgreSQL ni
# Ollama. Repositorio en memoria (los informes se pierden al reiniciar o cuando
# el servidor gratuito se duerme) e IA desactivada: el análisis termina como
# COMPLETED_WITHOUT_AI y los hallazgos verificados por reglas se muestran igual.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

server:
  # El proveedor indica el puerto en la variable PORT.
  port: ${PORT:8080}

browseme:
  persistence: memory
  ai:
    mode: ${BROWSEME_AI_MODE:disabled}
  web:
    # Obligatorio: la URL pública del frontend (por ejemplo, https://browseme.vercel.app).
    allowed-origins: ${BROWSEME_ALLOWED_ORIGINS}
    hsts: ${BROWSEME_HSTS:true}
