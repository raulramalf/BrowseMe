# Entorno completo: PostgreSQL, Ollama, backend y frontend (nginx).
# Uso: cp .env.example .env  (y cambia la contraseña)  &&  docker compose up --build
# Con poca RAM: BROWSEME_AI_MODE=disabled en .env y
#   docker compose up --build postgres backend frontend

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-browseme}
      POSTGRES_USER: ${POSTGRES_USER:-browseme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.4
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # Descarga el modelo una vez (queda en el volumen) y termina.
  ollama-pull:
    image: ollama/ollama:0.40.4
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${BROWSEME_AI_MODEL:-llama3.2:3b}"]
    depends_on:
      - ollama
    restart: "no"

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-browseme}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-browseme}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      OLLAMA_BASE_URL: http://ollama:11434
      BROWSEME_AI_MODE: ${BROWSEME_AI_MODE:-ollama}
      BROWSEME_AI_MODEL: ${BROWSEME_AI_MODEL:-llama3.2:3b}
      BROWSEME_AI_TIMEOUT: ${BROWSEME_AI_TIMEOUT:-120s}
      BROWSEME_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-8080}
      BROWSEME_HSTS: ${BROWSEME_HSTS:-false}
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres:
        condition: service_healthy
    # Sin puertos publicados: solo nginx habla con el backend.
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-data:
